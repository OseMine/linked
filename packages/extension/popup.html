<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 20px;
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #a1a1a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      font-size: 12px;
      color: #a1a1a6;
      margin-top: 4px;
    }
    .btn {
      width: 100%;
      padding: 12px 16px;
      background: #6c5ce7;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #7c6cf7; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #a1a1a6;
      text-align: center;
    }
    .status.error { color: #ff453a; }
    .status.success { color: #34c759; }
    .not-music {
      text-align: center;
      color: #a1a1a6;
      font-size: 14px;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Linked</h1>
    <p>Music Link Unifier</p>
  </div>
  <div id="content">
    <p class="not-music">Checking current page...</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
